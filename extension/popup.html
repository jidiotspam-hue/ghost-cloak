<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Docs Workspace Assistant</title>
  <style>
    body {
      width: 280px;
      margin: 0;
      padding: 14px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f8f9fa;
      color: #202124;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      border-bottom: 1px solid #dadce0;
      padding-bottom: 8px;
    }
    .icon { font-size: 20px; }
    .title { font-size: 14px; font-weight: 600; color: #1a73e8; }
    .status-box {
      background: #e6f4ea;
      border: 1px solid #ceead6;
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 12px;
      color: #137333;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .stat-row {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: #5f6368;
      margin: 4px 0;
    }
    .btn {
      width: 100%;
      background: #1a73e8;
      color: white;
      border: none;
      padding: 8px;
      border-radius: 6px;
      font-weight: 500;
      cursor: pointer;
      margin-top: 10px;
      font-size: 12px;
    }
    .btn:hover { background: #1557b0; }
  </style>
</head>
<body>
  <div class="header">
    <span class="icon">📘</span>
    <span class="title">Academic Workspace Sync</span>
  </div>

  <div class="status-box">
    <span>✔</span>
    <span>Active &bull; Privacy Shield Engaged</span>
  </div>

  <div class="stat-row">
    <span>Focus Interceptor:</span>
    <b style="color: #137333;">Protected</b>
  </div>
  <div class="stat-row">
    <span>Visibility Spoofing:</span>
    <b style="color: #137333;">Always Active</b>
  </div>
  <div class="stat-row">
    <span>Close Guard:</span>
    <b style="color: #137333;">Armed</b>
  </div>
  <div class="stat-row">
    <span>Telemetry Neutralizer:</span>
    <b style="color: #137333;">Active</b>
  </div>

  <button class="btn" onclick="window.open('https://jidiotspam-hue.github.io/ghost-cloak/', '_blank')">
    Open Academic Hub
  </button>
</body>
</html>
